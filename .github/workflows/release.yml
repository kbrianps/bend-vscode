# A v* tag builds, tests and packages the extension, publishes the .vsix
# as that tag's release, and pushes it to the VS Code Marketplace and to
# Open VSX when their tokens (VSCE_PAT, OVSX_PAT) are set as secrets. Run
# by hand, it packages, and publishes to the two registries only if asked.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      registries:
        description: "Publish the current version to the Marketplace and Open VSX"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      PUBLISH: ${{ github.ref_type == 'tag' || inputs.registries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: The tag names the version in package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Notes
        run: |
          lsp=$(node -p 'require("./package-lock.json").packages["node_modules/bend2-lsp"].version')
          echo "Bundles bend2-lsp $lsp." > notes.md
          echo "" >> notes.md
          echo "Install: \`code --install-extension kbrianps.bend2\`, or this release's .vsix." >> notes.md
          cat notes.md
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: VS Code Marketplace
        if: env.PUBLISH == 'true' && env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix
      - name: Open VSX
        if: env.PUBLISH == 'true' && env.OVSX_PAT != ''
        run: |
          npx --yes ovsx create-namespace kbrianps || true
          npx --yes ovsx publish *.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
